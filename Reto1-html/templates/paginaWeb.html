<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillia</title>
</head>

<body style="background-color: #10111b; color: white; font-family: Arial;">

    <!-- CABECERA -->
    <div style="background-color: #1b1d2c;
                border: 1px solid #35394f;
                padding: 20px;
                display: flex;
                align-items: center;">

        <!-- NOMBRE DE LA APLICACIÓN -->
        <div style="background-color: #242739;
                    padding: 15px 25px;
                    color: #ffd900;
                    font-size: 50px;
                    font-weight: bold;">
            SKILLIA
        </div>

        <!-- ESPACIO QUE EMPUJA LOS RECUADROS A LA DERECHA -->
        <div style="flex: 1;"></div>

        <!-- ORO -->
        <div style="background-color: #242739;
                    width: 110px;
                    height: 80px;
                    text-align: center;
                    margin-left: 20px;">

            <p>Oro</p>
            <p>0</p>

        </div>

        <!-- OLEADA -->
        <div style="background-color: #242739;
                    width: 110px;
                    height: 80px;
                    text-align: center;
                    margin-left: 20px;">

            <p>Oleada</p>
            <p id="oleada">1</p>

        </div>

        <!-- RÉCORD -->
        <div style="background-color: #242739;
                    width: 110px;
                    height: 80px;
                    text-align: center;
                    margin-left: 20px;">

            <p>Récord</p>
            <p id="record">1</p>

        </div>

    </div>


    <!-- ZONA PRINCIPAL -->
    <div style="display: flex;
                gap: 20px;
                margin-top: 20px;">

        <!-- CUADRO IZQUIERDO -->
        <div style="background-color: #1b1d2c;
                    border: 1px solid #35394f;
                    width: 300px;
                    height: 500px;">
        </div>


        <!-- CUADRO DEL COMBATE -->
        <div style="background-color: #1b1d2c;
                    border: 1px solid #35394f;
                    flex: 1;
                    height: 500px;
                    position: relative;
                    overflow: hidden;">

            <!-- CAPA 1: FONDO -->
            <img src="/static/Fondo.png"
                 style="position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        z-index: 0;">

            <!-- CAPA 2: HÉROE (con id, transition y punto de giro en los pies) -->
            <img id="heroe" src="/static/caballero.jpg"
                 style="position: absolute;
                        bottom: 30px;
                        left: 10%;
                        height: 150px;
                        z-index: 1;
                        transition: transform 0.3s;
                        transform-origin: bottom center;">

            <!-- CAPA 3: ENEMIGO -->
            <img id="enemigo" src="/static/slime.jpg"
                 style="position: absolute;
                        bottom: 30px;
                        right: 10%;
                        height: 100px;
                        z-index: 1;
                        transition: transform 0.3s, opacity 0.5s;
                        transform-origin: bottom center;">

            <!-- BARRA DE VIDA DEL HÉROE -->
            <div style="position: absolute;
                        bottom: 200px;
                        left: 10%;
                        width: 120px;
                        height: 12px;
                        background-color: gray;
                        z-index: 2;">

                <div id="barra-heroe"
                     style="width: 100%;
                            height: 100%;
                            background-color: green;">
                </div>

            </div>

            <!-- BARRA DE VIDA DEL ENEMIGO -->
            <div id="caja-barra-enemigo"
                 style="position: absolute;
                        bottom: 150px;
                        right: 10%;
                        width: 100px;
                        height: 12px;
                        background-color: gray;
                        z-index: 2;
                        transition: opacity 0.5s;">

                <div id="barra-enemigo"
                     style="width: 100%;
                            height: 100%;
                            background-color: red;">
                </div>

            </div>

            <!-- PANTALLA DE GAME OVER (escondida hasta que muera el caballero) -->
            <div id="pantalla-gameover"
                 style="position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background-color: rgba(0, 0, 0, 0.8);
                        text-align: center;
                        display: none;
                        z-index: 10;">

                <h1 style="color: #ff4d5e; font-size: 70px; margin-top: 110px; margin-bottom: 10px;">GAME OVER</h1>

                <p style="font-size: 20px;">Oleada alcanzada:</p>
                <p id="oleada-final" style="color: #f5c548; font-size: 40px; font-weight: bold; margin: 5px 0 25px 0;">1</p>

                <button onclick="empezarCombate()"
                        style="background-color: #f5c548; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer;">
                    VOLVER A INTENTAR
                </button>

            </div>

        </div>

    </div>


    <!-- BOTÓN PARA EMPEZAR EL COMBATE -->
    <button id="boton-empezar" onclick="empezarCombate()"
            style="margin-top: 20px; padding: 10px 20px; background-color: #f5c548; border: none; font-weight: bold; cursor: pointer;">
        Empezar
    </button>

    <!-- Botón de prueba (luego se quitará) -->
    <button onclick="saltarOleadas()"
            style="margin-top: 20px; padding: 10px 20px;">
        Saltar 10 oleadas (prueba)
    </button>

    <!-- EQUIPAMIENTO Y ESTADÍSTICAS -->
    <div style="background-color: #1b1d2c;
                border: 1px solid #35394f;
                width: auto;
                height: 500px;
                margin-top: 20px;">

        <div class="panel equipment">

            <h2>EQUIPAMIENTO</h2>

            <div class="equipment-layout">

                <!-- ESPACIO PARA EQUIPAMIENTO -->
                <div id="equipment-slots"
                     class="equipment-slots">
                </div>


                <!-- ESTADÍSTICAS -->
                <div class="stats-box">

                    <h3>ESTADÍSTICAS</h3>

                    <p>
                        ❤️ Vida
                        <strong id="stat-vida">
                            {{ jugador.vida_maxima }}
                        </strong>
                    </p>

                    <p title="Daño de cada golpe">
                        ⚔️ Ataque
                        <strong id="daño">
                            {{ jugador.daño }}
                        </strong>
                    </p>

                    <p title="Reduce el daño que recibes">
                        🛡️ Defensa
                        <strong id="stat-defensa">
                            {{ jugador.defensa }}
                        </strong>
                    </p>

                    <p title="Atacas más rápido">
                        💨 Velocidad
                        <strong id="stat-velocidad">
                            {{ jugador.velocidad }}
                        </strong>
                    </p>

                    <p title="Robo de vida">
                        🧛🏻 Robo de Vida
                        <strong id="stat-robo_vida">
                            {{ jugador.robo_vida }}
                        </strong>
                    </p>

                </div>

            </div>

        </div>

    </div>


<script>
    // =====================================================
    //  DATOS DEL HÉROE (se piden a app.py al abrir la página)
    // =====================================================
    let vida = 100;
    let vidaMaxima = 100;
    let danoHeroe = 10;
    let defensaHeroe = 0;

    function cargarJugador() {
        fetch("/api/jugador")
            .then(r => r.json())
            .then(j => {
                vidaMaxima = j.vida_maxima;
                vida = j.vida_maxima;
                danoHeroe = j["daño"];
                defensaHeroe = j.defensa;
            });
    }

    // =====================================================
    //  DATOS DEL ENEMIGO
    // =====================================================
    // Cada tipo dura 10 oleadas. vida = base + extra * (oleada dentro del tramo)
    let enemigos = [
        { nombre: "Slime",     imagen: "/static/slime.jpg",     vida: 30,  extra: 5,  altura: 100 },
        { nombre: "Goblin",    imagen: "/static/goblin.jpg",    vida: 100, extra: 10, altura: 120 },
        { nombre: "Esqueleto", imagen: "/static/esqueleto.jpg", vida: 200, extra: 20, altura: 140 },
        { nombre: "Minotauro", imagen: "/static/minotauro.jpg", vida: 400, extra: 40, altura: 180 }
    ];

    let oleada = 1;
    let record = 1;
    let vidaEnemigo = 30;
    let vidaMaxEnemigo = 30;

    // Interruptor: ¿hay un combate en marcha?
    let combateActivo = false;


    // =====================================================
    //  PREPARAR AL ENEMIGO
    // =====================================================
    function nuevoEnemigo() {
        let tipo = Math.floor((oleada - 1) / 10);
        if (tipo > enemigos.length - 1) {
            tipo = enemigos.length - 1;
        }
        let elegido = enemigos[tipo];
        let posicion = oleada - 1 - tipo * 10;

        let img = document.getElementById("enemigo");
        img.src = elegido.imagen;
        img.style.height = elegido.altura + "px";

        // La barra sube o baja según lo alto que sea el enemigo
        document.getElementById("caja-barra-enemigo").style.bottom = (30 + elegido.altura + 10) + "px";

        vidaMaxEnemigo = elegido.vida + posicion * elegido.extra;
        vidaEnemigo = vidaMaxEnemigo;
        document.getElementById("barra-enemigo").style.width = "100%";
    }

    function subirOleada(cantidad) {
        oleada = oleada + cantidad;
        if (oleada > record) {
            record = oleada;
        }
        document.getElementById("oleada").textContent = oleada;
        document.getElementById("record").textContent = record;
    }

    // Solo para probar los tramos
    function saltarOleadas() {
        subirOleada(10);
        nuevoEnemigo();
    }


    // =====================================================
    //  ANIMACIÓN DE ATAQUE
    // =====================================================
    // El personaje se lanza hacia delante y vuelve a su sitio
    function atacar(id, distancia) {
        let personaje = document.getElementById(id);
        personaje.style.transform = "translateX(" + distancia + "px)";

        setTimeout(function () {
            personaje.style.transform = "translateX(0px)";
        }, 350);
    }


    // =====================================================
    //  EL COMBATE
    // =====================================================
    function empezarCombate() {
        if (combateActivo) {
            return;
        }

        // Esconder la pantalla de game over (si estaba)
        document.getElementById("pantalla-gameover").style.display = "none";

        // Si venimos de una derrota, se empieza de cero
        if (vida <= 0) {
            vida = vidaMaxima;
            document.getElementById("barra-heroe").style.width = "100%";
            document.getElementById("heroe").style.transform = "rotate(0deg)";
            oleada = 1;
            document.getElementById("oleada").textContent = 1;
            nuevoEnemigo();
        }

        combateActivo = true;
        document.getElementById("boton-empezar").disabled = true;
        turnoHeroe();
    }

    // TURNO DEL HÉROE
    function turnoHeroe() {
        if (combateActivo == false) {
            return;
        }

        atacar("heroe", 120);

        // El golpe "llega" un poco después de empezar el movimiento
        setTimeout(function () {
            vidaEnemigo = vidaEnemigo - danoHeroe;
            if (vidaEnemigo < 0) {
                vidaEnemigo = 0;
            }
            document.getElementById("barra-enemigo").style.width = (vidaEnemigo / vidaMaxEnemigo * 100) + "%";

            if (vidaEnemigo == 0) {
                morirEnemigo();
            } else {
                setTimeout(turnoEnemigo, 900);   // ahora le toca al enemigo
            }
        }, 250);
    }

    // TURNO DEL ENEMIGO
    function turnoEnemigo() {
        if (combateActivo == false) {
            return;
        }

        atacar("enemigo", -120);

        setTimeout(function () {
            // El enemigo pega más fuerte cada oleada. La defensa reduce el daño.
            let dano = 3 + oleada * 2 - defensaHeroe;
            if (dano < 1) {
                dano = 1;
            }

            vida = vida - dano;
            if (vida < 0) {
                vida = 0;
            }
            document.getElementById("barra-heroe").style.width = (vida / vidaMaxima * 100) + "%";

            if (vida == 0) {
                morirHeroe();
            } else {
                setTimeout(turnoHeroe, 900);     // ahora le toca al héroe
            }
        }, 250);
    }


    // =====================================================
    //  MORIR
    // =====================================================
    function morirEnemigo() {
        let enemigo = document.getElementById("enemigo");
        let caja = document.getElementById("caja-barra-enemigo");

        // 1. Se cae
        enemigo.style.transform = "rotate(90deg)";

        // 2. Desaparece (él y su barra)
        setTimeout(function () {
            enemigo.style.opacity = 0;
            caja.style.opacity = 0;
        }, 600);

        // 3. Se endereza, sube la oleada y reaparece el siguiente
        setTimeout(function () {
            enemigo.style.transform = "rotate(0deg)";
            subirOleada(1);
            nuevoEnemigo();

            enemigo.style.opacity = 1;
            caja.style.opacity = 1;

            // Y el combate sigue con el siguiente enemigo
            setTimeout(turnoHeroe, 700);
        }, 1800);
    }

    function morirHeroe() {
        combateActivo = false;
        document.getElementById("heroe").style.transform = "rotate(-90deg)";

        // El botón de abajo vuelve a estar disponible
        document.getElementById("boton-empezar").disabled = false;

        // Cuando el caballero ya está en el suelo, sale GAME OVER
        setTimeout(function () {
            document.getElementById("oleada-final").textContent = oleada;
            document.getElementById("pantalla-gameover").style.display = "block";
        }, 900);
    }


    // Al abrir la página: se piden los datos del héroe y se prepara el primer enemigo
    cargarJugador();
    nuevoEnemigo();
</script>

</body>

</html>
