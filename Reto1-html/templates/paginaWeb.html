<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillia</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="cabecera">

        <h1 class="nombreApp">SKILLIA</h1>

        <div class="espacio"></div>

        <div class="marcador">
            <p>Oro</p>
            <p id="oro">0</p>
        </div>

        <div class="marcador">
            <p>Oleada</p>
            <p id="oleada">1</p>
        </div>

        <div class="marcador">
            <p>Record</p>
            <p id="record">1</p>
        </div>

    </header>


    <!-- ZONA PRINCIPAL -->
    <main class="zonaPrincipal">

        <!-- CUADRO IZQUIERDO -->
        <aside class="cuadroIzquierdo"></aside>
        

        <!-- CUADRO DEL COMBATE -->
        <section class="cuadroCombate">

            <!-- CAPA 1: FONDO -->
            <img class="fondo" src="/static/Fondo.png" alt="Paisaje de montañas de noche">

            <!-- CAPA 2: HEROE -->
            <img id="heroe" class="personaje" src="/static/caballero.png" alt="Caballero">

            <!-- CAPA 2: ENEMIGO -->
            <img id="enemigo" class="personaje" src="/static/goblin.png" alt="Goblin">

            <!-- BARRA DE VIDA DEL HEROE -->
            <div id="cajaBarraHeroe" class="barra">
                <div id="barra-heroe" class="relleno verde"></div>
            </div>

            <!-- BARRA DE VIDA DEL ENEMIGO -->
            <div id="cajaBarraEnemigo" class="barra">
                <div id="barra-enemigo" class="relleno rojo"></div>
            </div>

            <!-- PANTALLA DE GAME OVER -->
            <div id="pantalla-gameover" class="gameOver">
                <h2>GAME OVER</h2>
                <p>Oleada alcanzada:</p>
                <p id="oleada-final" class="oleadaFinal">1</p>
                <button class="boton" onclick="empezarCombate()">VOLVER A INTENTAR</button>
            </div>

        </section>

    </main>

    <!-- BOTON PARA EMPEZAR EL COMBATE -->
    <button id="boton-empezar" class="boton botonEmpezar" onclick="empezarCombate()">Empezar</button>


    <!-- EQUIPAMIENTO Y ESTADISTICAS -->
    <section class="panelEquipamiento">

        <h2>EQUIPAMIENTO</h2>

        <div class="contenidoEquipamiento">

            <!-- ESPACIO PARA EL EQUIPAMIENTO -->
            <div id="equipment-slots" class="huecosEquipamiento"></div>

            <!-- ESTADISTICAS -->
            <aside class="estadisticas">

                <h3>ESTADISTICAS</h3>

                <p>❤️ Vida <strong id="stat-vida">{{ jugador.vida_maxima }}</strong></p>

                <p title="Daño de cada golpe">⚔️ Ataque <strong id="stat-ataque">{{ jugador.daño }}</strong></p>

                <p title="Reduce el daño que recibes">🛡️ Defensa <strong id="stat-defensa">{{ jugador.defensa }}</strong></p>

                <p title="Robo de vida">🧛🏻 Robo de Vida <strong id="stat-robo_vida">{{ jugador.robo_vida }}</strong></p>

            </aside>

        </div>

    </section>


<script>

    // ---------- VARIABLES ----------
    let vida = 100;
    let vidaMaxima = 100;
    let danoHeroe = 10;
    let defensaHeroe = 0;
    let roboVidaHeroe = 0;

    let oleada = 1;
    let record = 1;

    let vidaEnemigo = 25;
    let vidaMaxEnemigo = 25;

    let combateActivo = false;


    // ---------- ENEMIGO (mas fuerte cada oleada) ----------
    function nuevoEnemigo() {
        vidaMaxEnemigo = 20 + oleada * 5;
        vidaEnemigo = vidaMaxEnemigo;
        document.getElementById("barra-enemigo").style.width = "100%";
    }


    // ---------- MOVER AL PERSONAJE AL ATACAR ----------
    function atacar(id, distancia) {
        let personaje = document.getElementById(id);
        personaje.style.transform = "translateX(" + distancia + "px)";

        setTimeout(function () {
            personaje.style.transform = "translateX(0px)";
        }, 350);
    }


    // ---------- EMPEZAR ----------
    function empezarCombate() {
        if (combateActivo) {
            return;
        }

        document.getElementById("pantalla-gameover").style.display = "none";

        // Si venimos de morir, empezamos de cero
        if (vida <= 0) {
            vida = vidaMaxima;
            oleada = 1;
            document.getElementById("barra-heroe").style.width = "100%";
            document.getElementById("heroe").style.transform = "rotate(0deg)";
            document.getElementById("oleada").textContent = oleada;
            nuevoEnemigo();
        }

        combateActivo = true;
        document.getElementById("boton-empezar").disabled = true;
        turnoHeroe();
    }


    // ---------- TURNO DEL HEROE ----------
    function turnoHeroe() {
        if (combateActivo == false) {
            return;
        }

        atacar("heroe", 120);

        setTimeout(function () {
            vidaEnemigo = vidaEnemigo - danoHeroe;
            if (vidaEnemigo < 0) {
                vidaEnemigo = 0;
            }
            document.getElementById("barra-enemigo").style.width = (vidaEnemigo / vidaMaxEnemigo * 100) + "%";

            if (vidaEnemigo == 0) {
                morirEnemigo();
            } else {
                setTimeout(turnoEnemigo, 900);
            }
        }, 250);
    }


    // ---------- TURNO DEL ENEMIGO ----------
    function turnoEnemigo() {
        if (combateActivo == false) {
            return;
        }

        atacar("enemigo", -120);

        setTimeout(function () {
            let dano = 3 + oleada * 2 - defensaHeroe;   // la defensa reduce el daño
            if (dano < 1) {
                dano = 1;
            }
            vida = vida - dano;
            if (vida < 0) {
                vida = 0;
            }
            document.getElementById("barra-heroe").style.width = (vida / vidaMaxima * 100) + "%";

            if (vida == 0) {
                morirHeroe();
            } else {
                setTimeout(turnoHeroe, 900);
            }
        }, 250);
    }


    // ---------- MUERE EL ENEMIGO ----------
    function morirEnemigo() {
        let enemigo = document.getElementById("enemigo");
        let caja = document.getElementById("cajaBarraEnemigo");

        enemigo.style.transform = "rotate(90deg)";      // se cae

        setTimeout(function () {                         // desaparece
            enemigo.style.opacity = 0;
            caja.style.opacity = 0;
        }, 600);

        setTimeout(function () {                         // reaparece el siguiente
            enemigo.style.transform = "rotate(0deg)";
            oleada = oleada + 1;
            if (oleada > record) {
                record = oleada;
            }
            document.getElementById("oleada").textContent = oleada;
            document.getElementById("record").textContent = record;

            nuevoEnemigo();
            enemigo.style.opacity = 1;
            caja.style.opacity = 1;

            setTimeout(turnoHeroe, 700);
        }, 1800);
    }


    // ---------- MUERE EL CABALLERO ----------
    function morirHeroe() {
        combateActivo = false;
        document.getElementById("heroe").style.transform = "rotate(-90deg)";
        document.getElementById("boton-empezar").disabled = false;

        setTimeout(function () {
            document.getElementById("oleada-final").textContent = oleada;
            document.getElementById("pantalla-gameover").style.display = "block";
        }, 900);
    }


    // Pide a app.py los datos del heroe (el equipamiento comprado cambia estas cifras)
    function cargarJugador() {
        fetch("/api/jugador")
            .then(r => r.json())
            .then(j => {
                vidaMaxima = j.vida_maxima;
                vida = j.vida_maxima;
                danoHeroe = j["daño"];
                defensaHeroe = j.defensa;
                document.getElementById("oro").textContent = j.oro;
            });
    }

    cargarJugador();
    nuevoEnemigo();

</script>

</body>

</html>
